<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Jornada — Dashboard</title>
  <meta name="description" content="Registra tu hora de entrada y salida del día y consulta tu historial de jornadas." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="mi-jornada">
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
      </span>
      <span class="brand-name">Dashboard</span>
    </a>
    <div class="user-chip">
      <span class="user-avatar" id="user-avatar" aria-hidden="true">--</span>
      <span class="user-info">
        <span class="user-role" id="user-nombre">Cargando…</span>
        <span class="user-date" id="today-date"></span>
      </span>
      <button class="btn btn-secondary btn-logout" id="btn-logout" type="button">Salir</button>
    </div>
  </header>

  <main>
    <a class="back-link" href="index.html">&larr; Volver al panel</a>
    <h1 class="page-title">Mi Jornada</h1>
    <p class="page-subtitle">Registra tu hora de entrada y salida del día.</p>

    <div class="panel">
      <div class="jornada-estado">
        <div>
          <span class="form-hint">Estado de hoy</span>
          <h2 id="estado-jornada" style="margin:2px 0 0;">Sin marcar entrada</h2>
        </div>
        <div class="form-actions">
          <button id="btn-entrada" class="btn btn-primary">Marcar entrada</button>
          <button id="btn-salida" class="btn btn-secondary" disabled>Marcar salida</button>
        </div>
      </div>

      <div class="jornada-horas">
        <div><span>Entrada</span><strong id="hora-entrada">--:--</strong></div>
        <div><span>Salida</span><strong id="hora-salida">--:--</strong></div>
        <div><span>Total del día</span><strong id="horas-trabajadas">--</strong></div>
      </div>
    </div>

    <div class="panel">
      <h2>Últimos 7 días</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Horas</th></tr>
          </thead>
          <tbody id="historial-jornada"></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="page-footer">
    <p>Dashboard — panel interno del taller</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
