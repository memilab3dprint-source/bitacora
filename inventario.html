<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario — Dashboard</title>
  <meta name="description" content="Revisa el stock disponible del taller y su valor total." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="inventario">
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
      </span>
      <span class="brand-name">Dashboard</span>
    </a>
    <div class="user-chip">
      <span class="user-avatar" id="user-avatar" aria-hidden="true">--</span>
      <span class="user-info">
        <span class="user-role" id="user-nombre">Cargando…</span>
        <span class="user-date" id="today-date"></span>
      </span>
      <button class="btn btn-secondary btn-logout" id="btn-logout" type="button">Salir</button>
    </div>
  </header>

  <main>
    <a class="back-link" id="back-link" href="index.html">&larr; Volver al panel</a>
    <h1 class="page-title">Inventario</h1>
    <p class="area-tag" id="area-tag"></p>
    <p class="page-subtitle">Revisa el stock disponible y su estado.</p>

    <p class="alerta-stock-bajo" id="alerta-stock-bajo" hidden></p>

    <div class="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Nombre</th><th>Categoría</th><th>Cantidad</th><th>Mínimo</th><th>Precio</th><th>Subtotal</th><th></th></tr>
          </thead>
          <tbody id="tabla-inventario"></tbody>
        </table>
      </div>
      <div class="table-totals">
        <div><span class="form-hint">Unidades totales</span><strong id="total-unidades">0</strong></div>
        <div><span class="form-hint">Valor total</span><strong id="total-valor">$0</strong></div>
      </div>
    </div>

    <p class="form-hint">
      <a href="agregar-producto.html">+ Agregar otro producto</a>
    </p>
  </main>

  <footer class="page-footer">
    <p>Dashboard — panel interno del taller</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
