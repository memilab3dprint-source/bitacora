<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="login">
  <main class="login-main">
    <div class="panel login-panel">
      <div class="brand" style="margin-bottom:20px;">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          </svg>
        </span>
        <span class="brand-name">Dashboard</span>
      </div>

      <h1 class="page-title" style="font-size:1.25rem;">Inicia sesión</h1>
      <p class="page-subtitle">Usa el email y contraseña que te dio tu administrador.</p>

      <form id="form-login" onsubmit="return false">
        <div class="field" style="margin-bottom:14px;">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" required autocomplete="username" />
        </div>
        <div class="field" style="margin-bottom:14px;">
          <label for="login-password">Contraseña</label>
          <input id="login-password" type="password" required autocomplete="current-password" />
        </div>
        <p id="login-error" class="form-hint" style="color:#b91c1c;" hidden></p>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="login-submit">Entrar</button>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
